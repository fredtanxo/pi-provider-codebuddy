name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # npm 22's bundled CLI predates `npm stage`; 11.21.1 supports it on node 22.
      - run: npm install -g npm@11.21.1
      - run: npm run check
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm stage publish
      - name: Create GitHub release
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
